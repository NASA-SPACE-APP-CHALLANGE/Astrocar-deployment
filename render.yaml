services:
  # ── Backend Web Service ──────────────────────────────────────────
  - type: web
    name: astrocare-backend
    runtime: node
    rootDir: backend
    buildCommand: "echo no build needed"
    startCommand: "node server.cjs"
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_VERSION
        value: 22

  # ── Frontend Static Site ─────────────────────────────────────────
  - type: web
    name: astrocare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # You will fill this in after the backend deploys
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html

